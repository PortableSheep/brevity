name: Framework and documentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:release
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
        if: matrix.node == 22
      - run: npm run docs:e2e
        if: matrix.node == 22
  pages-build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: [verify, benchmark-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build:packages && npm run docs:check
      - run: npm run docs:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/benchmarks/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @brevity/core
      - run: npm ci --prefix examples/benchmarks
      - run: npm run bench --prefix examples/benchmarks --silent > benchmark-smoke.json
        env:
          REPEATS: 1
          WARMUP_MS: 100
          DURATION_MS: 200
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-smoke.json
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
