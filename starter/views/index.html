<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 3rem;
      max-width: 600px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.875rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: #764ba2;
    }
    a.secondary {
      background: #e0e7ff;
      color: #667eea;
    }
    a.secondary:hover {
      background: #c7d2fe;
    }
    .code-block {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 1rem;
      margin: 2rem 0;
      border-radius: 4px;
      text-align: left;
      overflow-x: auto;
    }
    code {
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.875rem;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Powered by Brevity</div>
    <h1>{{ title }}</h1>
    <p>Your lightweight framework is up and running! 🎉</p>
    
    <div class="code-block">
      <code>
        Edit <strong>src/index.ts</strong> to add routes and logic.<br>
        Edit <strong>views/index.html</strong> to customize this page.
      </code>
    </div>

    <p>Explore the framework:</p>
    <div class="links">
      <a href="/health">Health Check</a>
      <a href="/debug" class="secondary">View Logs</a>
    </div>
  </div>
</body>
</html>
