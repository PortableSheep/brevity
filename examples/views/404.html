<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>404 — Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 3rem; }
    .code { font-size: 6rem; font-weight: 800; color: #30363d; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: #8b949e; margin-bottom: 0.5rem; }
    p { color: #6e7681; margin-bottom: 2rem; }
    .path { font-family: monospace; background: #161b22; border: 1px solid #30363d; padding: 0.4rem 0.8rem; border-radius: 4px; color: #58a6ff; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.4rem; background: #21262d; border: 1px solid #30363d; color: #e6edf3; text-decoration: none; border-radius: 6px; }
    a:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>No route matched <span class="path">{{path}}</span></p>
    <a href="/">← Back to home</a>
  </div>
</body>
</html>
